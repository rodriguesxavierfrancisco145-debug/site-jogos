<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSP GAMER MOBILE 2</title>
    <style>
        :root {
            --bg-color: #0b0b0f;
            --card-bg: #13131a;
            --text-color: #f1f1f6;
            --text-muted: #8e8e99;
            --primary: #00ff88;
            --primary-hover: #00cc6a;
            --accent-pink: #ff007f;
            --accent-cyan: #00f0ff;
            --danger: #ff3366;
            --warning: #ffaa00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 0, 127, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 240, 255, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        /* Topo / Header Moderno Neon */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
            position: relative;
        }

        .logo {
            color: var(--accent-pink);
            font-size: 1.1rem;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
            letter-spacing: 0.5px;
            animation: pulseLogo 3s infinite alternate;
            white-space: nowrap;
        }

        @keyframes pulseLogo {
            0% { text-shadow: 0 0 8px rgba(255, 0, 127, 0.4); }
            100% { text-shadow: 0 0 16px rgba(255, 0, 127, 0.8), 0 0 20px rgba(0, 240, 255, 0.3); }
        }

        .search-container {
            flex: 1;
        }

        .search-box {
            width: 100%;
            background-color: #1a1a24;
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 20px;
            padding: 9px 16px;
            color: white;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .search-box:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4), inset 0 2px 4px rgba(0,0,0,0.5);
        }

        .top-icons {
            display: flex;
            align-items: center;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            position: relative;
        }

        .top-icons span {
            background: #1a1a24;
            padding: 8px 10px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .top-icons span:hover {
            border-color: var(--accent-pink);
            transform: scale(1.05);
        }

        /* Menu Dropdown dos Três Pontinhos */
        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 45px;
            background-color: var(--card-bg);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7), 0 0 15px rgba(0, 240, 255, 0.1);
            width: 160px;
            z-index: 100;
            overflow: hidden;
            animation: fadeInMenu 0.2s ease forwards;
        }

        @keyframes fadeInMenu {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-item {
            padding: 12px 15px;
            font-size: 0.85rem;
            color: var(--text-color);
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            text-decoration: none;
            display: block;
            transition: all 0.2s;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item:hover {
            background-color: rgba(255, 0, 127, 0.15);
            color: var(--accent-pink);
            padding-left: 18px;
        }

        /* Categorias (Filtros redondos em rolagem horizontal com estilo Neo) */
        .categories {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 20px;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background: linear-gradient(135deg, #1a1a24, #121218);
            color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.06);
            padding: 9px 20px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .cat-btn:hover {
            color: white;
            border-color: rgba(0, 240, 255, 0.4);
            transform: translateY(-2px);
        }

        .cat-btn.active {
            background: linear-gradient(135deg, var(--accent-pink), #b00055);
            color: white;
            border-color: var(--accent-pink);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
        }

        /* Abas de Navegação */
        .tab-content {
            display: none;
            animation: fadeInTab 0.3s ease;
        }
        @keyframes fadeInTab {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .tab-content.active {
            display: block;
        }

        /* Formulário do Painel Admin Animado */
        .form-card {
            background: linear-gradient(145deg, #161622, #101017);
            padding: 22px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            border: 1px solid rgba(0, 240, 255, 0.15);
        }

        .form-card h2 {
            margin-bottom: 18px;
            font-size: 1.3rem;
            color: var(--accent-cyan);
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.3);
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 11px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08);
            background-color: #0b0b0f;
            color: white;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.25);
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .input-group {
            flex: 1;
        }

        button {
            background: linear-gradient(135deg, var(--primary), #00aa5b);
            color: #0b0b0f;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.5);
            background: linear-gradient(135deg, #2bff9e, var(--primary));
        }

        /* Grid de Jogos (2 colunas) */
        .games-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        /* Cartão de Jogo com Estilo Neon Animado */
        .game-card {
            background: linear-gradient(145deg, #15151f, #0f0f16);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .game-card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: rgba(0, 240, 255, 0.5);
            box-shadow: 0 12px 30px rgba(0,0,0,0.7), 0 0 15px rgba(0, 240, 255, 0.25);
        }

        .card-img-container {
            position: relative;
            width: 100%;
            height: 140px;
            overflow: hidden;
        }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .game-card:hover img {
            transform: scale(1.1);
        }

        /* Selo de Status/Preço Flutuante */
        .price-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(11, 11, 15, 0.85);
            backdrop-filter: blur(5px);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--primary);
            border: 1px solid rgba(0, 255, 136, 0.3);
            box-shadow: 0 0 8px rgba(0, 255, 136, 0.2);
        }

        .game-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .game-info h3 {
            font-size: 0.95rem;
            margin-bottom: 6px;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 700;
        }

        .game-details {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .likes-row {
            display: flex;
            gap: 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .download-btn {
            display: block;
            text-align: center;
            background: linear-gradient(135deg, var(--accent-cyan), #0099ff);
            color: #0b0b0f;
            text-decoration: none;
            padding: 9px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 800;
            margin-top: auto;
            box-shadow: 0 4px 12px rgba(0, 240, 255, 0.3);
            transition: all 0.3s;
        }

        .download-btn:hover {
            background: linear-gradient(135deg, #33f3ff, var(--accent-cyan));
            box-shadow: 0 6px 16px rgba(0, 240, 255, 0.5);
            transform: translateY(-1px);
        }

        .delete-btn {
            background: linear-gradient(135deg, var(--danger), #cc0033);
            color: white;
            margin-top: 8px;
            padding: 7px;
            font-size: 0.75rem;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(255, 51, 102, 0.3);
        }

        .delete-btn:hover {
            background: linear-gradient(135deg, #ff4d79, var(--danger));
            box-shadow: 0 5px 15px rgba(255, 51, 102, 0.5);
        }

        .empty-msg {
            text-align: center;
            grid-column: 1 / -1;
            color: var(--text-muted);
            font-style: italic;
            padding: 40px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px dashed rgba(255,255,255,0.08);
        }

        /* Estilo da Página de Detalhes do Jogo Neon */
        .game-detail-card {
            background: linear-gradient(145deg, #161622, #101017);
            border-radius: 16px;
            overflow: hidden;
            padding: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.6);
            border: 1px solid rgba(0, 240, 255, 0.2);
            animation: scaleIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes scaleIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .back-btn {
            background: #1a1a24;
            color: var(--text-color);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            cursor: pointer;
            margin-bottom: 15px;
            width: auto;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            transition: all 0.2s;
        }
        .back-btn:hover {
            background: #252533;
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .detail-img {
            width: 100%;
            height: 210px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .detail-info h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: white;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .detail-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin: 15px 0;
            line-height: 1.5;
            white-space: pre-wrap;
            background: #0b0b0f;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.04);
        }

        /* Rodapé com mensagem e acesso restrito */
        .admin-login-area {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .admin-link {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
            line-height: 1.4;
            transition: color 0.2s;
        }
        .admin-link:hover {
            color: var(--accent-cyan);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- TOPO NOVO ESTILO -->
        <div class="top-bar">
            <div class="logo">PSP GAMER MOBILE 2</div>
            <div class="search-container">
                <input type="text" class="search-box" id="searchInput" placeholder="Buscar jogos..." oninput="loadGames()">
            </div>
            <div class="top-icons">
                <span onclick="toggleMenu(event)" title="Menu">☰</span>
                <!-- Menu Dropdown -->
                <div id="dropdownMenu" class="dropdown-menu">
                    <div class="dropdown-item" onclick="abrirModalInfo('Suporte', 'Precisa de ajuda com algum jogo, link quebrado ou dúvida? Entre em contato com nossa equipe de suporte pelo WhatsApp do canal ou comunidade.')">Suporte</div>
                    <div class="dropdown-item" onclick="abrirModalInfo('Ajuda', '1. Escolha o jogo desejado.\n2. Clique nele para ver as informações completas.\n3. Clique em Baixar para obter o arquivo direto.')">Ajuda</div>
                    <div class="dropdown-item" onclick="abrirModalInfo('Parceria', 'Tem interesse em divulgar seu canal, jogo ou site aqui na PSP GAMER MOBILE 2? Entre em contato para parcerias e anúncios!')">Parceria</div>
                </div>
            </div>
        </div>

        <!-- CATEGORIAS REDONDAS NOVAS -->
        <div class="categories">
            <button class="cat-btn active" onclick="filtrarCategoria('Todos', this)">Todos</button>
            <button class="cat-btn" onclick="filtrarCategoria('PSP', this)">PSP</button>
            <button class="cat-btn" onclick="filtrarCategoria('PS2', this)">PS2</button>
            <button class="cat-btn" onclick="filtrarCategoria('PC', this)">PC</button>
            <button class="cat-btn" onclick="filtrarCategoria('APK', this)">APK</button>
        </div>

        <!-- ABA INÍCIO (PAINEL ADMIN) -->
        <div id="inicio" class="tab-content">
            <header style="margin-bottom: 15px;">
                <h1 style="font-size: 1.8rem; color: var(--accent-pink); text-shadow: 0 0 10px rgba(255,0,127,0.4);">🔒 Painel Restrito</h1>
                <p style="font-size: 0.85rem; color: var(--text-muted);">Adicione novos jogos à vitrine</p>
            </header>

            <div class="form-card">
                <h2>Publicar Novo Jogo</h2>
                <form id="gameForm">
                    <div class="input-group">
                        <label for="gameName">Nome do Jogo:</label>
                        <input type="text" id="gameName" required placeholder="Ex: GTA San Andreas">
                    </div>
                    <div class="input-group">
                        <label for="gameImage">Link da Imagem (URL):</label>
                        <input type="url" id="gameImage" required placeholder="Cole o link direto da imagem">
                    </div>
                    <div class="input-group">
                        <label for="gameCategory">Categoria:</label>
                        <select id="gameCategory" style="width:150px;">
                            <option value="PSP">PSP</option>
                            <option value="PS2">PS2</option>
                            <option value="PC">PC</option>
                            <option value="APK">APK</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="input-group">
                            <label for="gameSize">Tamanho:</label>
                            <input type="text" id="gameSize" required placeholder="Ex: 1.2 GB">
                        </div>
                        <div class="input-group">
                            <label for="gameFormat">Formato:</label>
                            <input type="text" id="gameFormat" required placeholder="Ex: ISO / APK">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="gameStatus">Preço / Status:</label>
                        <input type="text" id="gameStatus" required placeholder="Ex: Grátis">
                    </div>
                    <div class="input-group">
                        <label for="gameDescription">Informações / Descrição do Jogo:</label>
                        <textarea id="gameDescription" rows="3" placeholder="Digite os detalhes, requisitos ou instruções de instalação..."></textarea>
                    </div>
                    <div class="input-group">
                        <label for="gameLink">Link de Download:</label>
                        <input type="url" id="gameLink" required placeholder="Cole o link do MediaFire, Mega, etc.">
                    </div>
                    <button type="submit">Publicar Jogo</button>
                </form>
                <button onclick="logoutAdmin()" style="background: linear-gradient(135deg, var(--danger), #cc0033); color: white; margin-top: 15px; box-shadow: 0 4px 15px rgba(255,51,102,0.4);">Sair do Painel Admin</button>
            </div>
        </div>

        <!-- ABA JOGOS (VITRINE) -->
        <div id="jogos" class="tab-content active">
            <div class="games-grid" id="gamesGrid">
                <!-- Os jogos cadastrados aparecem aqui -->
            </div>
        </div>

        <!-- ABA DETALHES DO JOGO -->
        <div id="detalhes" class="tab-content">
            <button class="back-btn" onclick="switchTab('jogos')">← Voltar</button>
            <div id="gameDetailContent">
                <!-- Informações detalhadas do jogo carregadas via JS -->
            </div>
        </div>

        <!-- Rodapé com mensagem de boas-vindas e acesso restrito -->
        <div class="admin-login-area">
            <button class="admin-link" onclick="solicitarSenha()">Bem vindos au PSP GAMER MOBILE 2 esperamos que vcs gostem dos jogos.</button>
        </div>
    </div>

    <script>
        const gameForm = document.getElementById('gameForm');
        const gamesGrid = document.getElementById('gamesGrid');
        const SENHA_ADMIN = "1234"; 
        let categoriaAtual = 'Todos';

        document.addEventListener('DOMContentLoaded', () => {
            loadGames();
            if (localStorage.getItem('isAdmin') === 'true') {
                liberarAdmin();
            }

            // Fechar o menu dropdown ao clicar fora
            window.addEventListener('click', function(e) {
                if (!e.target.closest('.top-icons')) {
                    document.getElementById('dropdownMenu').classList.remove('show');
                }
            });
        });

        function toggleMenu(event) {
            event.stopPropagation();
            document.getElementById('dropdownMenu').classList.toggle('show');
        }

        function abrirInfo(titulo, texto) {
            alert(titulo + ":\n\n" + texto);
            document.getElementById('dropdownMenu').classList.remove('show');
        }

        // Função ajustada para abrir a notificação informativa do menu superior
        function abrirModalInfo(titulo, texto) {
            alert(titulo + "\n\n" + texto);
            document.getElementById('dropdownMenu').classList.remove('show');
        }

        function solicitarSenha() {
            if (localStorage.getItem('isAdmin') === 'true') {
                switchTab('inicio');
                return;
            }
            let senha = prompt("Digite a senha de administrador:");
            if (senha === SENHA_ADMIN) {
                localStorage.setItem('isAdmin', 'true');
                liberarAdmin();
                switchTab('inicio');
                alert("Painel liberado com sucesso!");
            } else if (senha !== null) {
                alert("Senha incorreta!");
            }
        }

        function liberarAdmin() {
            // Admin liberado
        }

        function logoutAdmin() {
            localStorage.removeItem('isAdmin');
            switchTab('jogos');
            alert("Você saiu do modo administrador.");
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.getElementById(tabId).classList.add('active');
        }

        function filtrarCategoria(cat, btn) {
            categoriaAtual = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadGames();
        }

        gameForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('gameName').value;
            const image = document.getElementById('gameImage').value;
            const category = document.getElementById('gameCategory').value || 'PSP';
            const size = document.getElementById('gameSize').value;
            const format = document.getElementById('gameFormat').value;
            const status = document.getElementById('gameStatus').value;
            const description = document.getElementById('gameDescription').value || 'Nenhuma informação adicional informada.';
            const link = document.getElementById('gameLink').value;

            const newGame = { 
                id: Date.now(), 
                name, 
                image, 
                category, 
                size, 
                format, 
                status, 
                description,
                link,
                likes: Math.floor(Math.random() * 25) + 1,
                dislikes: Math.floor(Math.random() * 4)
            };

            saveGame(newGame);
            gameForm.reset();
            loadGames();
            switchTab('jogos');
        });

        function getGames() {
            return JSON.parse(localStorage.getItem('my_games')) || [];
        }

        function saveGame(game) {
            const games = getGames();
            games.push(game);
            localStorage.setItem('my_games', JSON.stringify(games));
        }

        function deleteGame(id) {
            let games = getGames();
            games = games.filter(game => game.id !== id);
            localStorage.setItem('my_games', JSON.stringify(games));
            loadGames();
            switchTab('jogos');
        }

        function verDetalhesDoJogo(id) {
            const games = getGames();
            const game = games.find(g => g.id === id);
            if (!game) return;

            let botaoExcluirDetalhe = '';
            if (localStorage.getItem('isAdmin') === 'true') {
                botaoExcluirDetalhe = `<button class="delete-btn" onclick="deleteGame(${game.id})" style="margin-top: 15px;">Excluir Jogo do Site</button>`;
            }

            const detailContainer = document.getElementById('gameDetailContent');
            detailContainer.innerHTML = `
                <div class="game-detail-card">
                    <img src="${game.image}" class="detail-img" alt="${game.name}" onerror="this.src='https://via.placeholder.com/250x140?text=Erro+na+Imagem'">
                    <div class="detail-info">
                        <h2>${game.name}</h2>
                        <div class="likes-row" style="font-size: 0.85rem; margin-bottom: 12px;">
                            <span>❤ ${game.likes || 12} Curtidas</span>
                            <span>👎 ${game.dislikes || 1} Descurtidas</span>
                            <span style="color: var(--primary);">🏷️ ${game.status}</span>
                        </div>
                        <div class="game-details" style="font-size: 0.85rem; margin-bottom: 15px; gap: 6px;">
                            <span>📦 Tamanho: <strong>${game.size}</strong></span>
                            <span>📁 Formato: <strong>${game.format}</strong></span>
                            <span>📂 Categoria: <strong>${game.category}</strong></span>
                        </div>
                        <h4 style="font-size: 0.95rem; color: white; margin-bottom: 5px;">Informações do Jogo:</h4>
                        <p class="detail-desc">${game.description}</p>
                        
                        <a href="${game.link}" target="_blank" class="download-btn" style="padding: 12px; font-size: 0.95rem; margin-top: 20px;">Baixar Agora (Download Direto)</a>
                        ${botaoExcluirDetalhe}
                    </div>
                </div>
            `;
            switchTab('detalhes');
        }

        function loadGames() {
            const games = getGames();
            const termoBusca = document.getElementById('searchInput') ? document.getElementById('searchInput').value.toLowerCase() : '';
            gamesGrid.innerHTML = '';

            let filtrados = games.filter(game => {
                let matchCat = (categoriaAtual === 'Todos' || (game.category && game.category === categoriaAtual));
                let matchBusca = game.name.toLowerCase().includes(termoBusca);
                return matchCat && matchBusca;
            });

            if (filtrados.length === 0) {
                gamesGrid.innerHTML = '<p class="empty-msg">Nenhum jogo cadastrado ainda.</p>';
                return;
            }

            filtrados.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => verDetalhesDoJogo(game.id);

                let botaoExcluirHtml = '';
                if (localStorage.getItem('isAdmin') === 'true') {
                    botaoExcluirHtml = `
                        <div style="padding: 0 10px 10px 10px;" onclick="event.stopPropagation()">
                            <button class="delete-btn" onclick="deleteGame(${game.id})">Excluir</button>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div>
                        <div class="card-img-container">
                            <img src="${game.image}" alt="${game.name}" onerror="this.src='https://via.placeholder.com/250x140?text=Erro+na+Imagem'">
                            <div class="price-badge">${game.status}</div>
                        </div>
                        <div class="game-info">
                            <h3>${game.name}</h3>
                            <div class="likes-row">
                                <span>❤ ${game.likes || 12}</span>
                                <span>👎 ${game.dislikes || 1}</span>
                            </div>
                            <div class="game-details">
                                <span>📦 Tamanho: <strong>${game.size}</strong></span>
                                <span>📁 Formato: <strong>${game.format}</strong></span>
                            </div>
                            <span class="download-btn" style="display: block;">Ver Detalhes / Baixar</span>
                        </div>
                    </div>
                    ${botaoExcluirHtml}
                `;

                gamesGrid.appendChild(card);
            });
        }
    </script>
</body>
</html>
