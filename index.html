<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site de Jogos</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #202024;
            --text-color: #e1e1e6;
            --primary: #00b37e;
            --primary-hover: #00875f;
            --danger: #f75a68;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Menu de Navegação (Abas) */
        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .nav-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid #323238;
            padding: 10px 25px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: 0.2s;
            width: auto;
        }

        .nav-btn.active, .nav-btn:hover {
            background-color: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .form-card h2 {
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #323238;
            background-color: #121214;
            color: white;
            font-size: 1rem;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .input-group {
            flex: 1;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .game-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .game-info {
            padding: 15px;
        }

        .game-info h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-details {
            font-size: 0.85rem;
            color: #afafbc;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .download-btn {
            display: block;
            text-align: center;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            padding: 8px;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 10px;
        }

        .download-btn:hover {
            background-color: var(--primary-hover);
        }

        .delete-btn {
            background-color: var(--danger);
            margin-top: 8px;
            padding: 6px;
            font-size: 0.85rem;
            width: 100%;
        }

        .delete-btn:hover {
            background-color: #d93848;
        }

        .empty-msg {
            text-align: center;
            grid-column: 1 / -1;
            color: #7c7c8a;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Menu de Abas -->
        <nav>
            <button class="nav-btn active" onclick="switchTab('inicio')">Início</button>
            <button class="nav-btn" onclick="switchTab('jogos')">Jogos</button>
        </nav>

        <!-- ABA INÍCIO -->
        <div id="inicio" class="tab-content active">
            <header>
                <h1>🎮 Meus Jogos</h1>
                <p>Adicione e baixe seus jogos favoritos</p>
            </header>

            <!-- Formulário para cadastrar o jogo -->
            <div class="form-card">
                <h2>Publicar Novo Jogo</h2>
                <form id="gameForm">
                    <div class="input-group">
                        <label for="gameName">Nome do Jogo:</label>
                        <input type="text" id="gameName" required placeholder="Ex: GTA San Andreas">
                    </div>
                    <div class="input-group">
                        <label for="gameImage">Link da Imagem (URL):</label>
                        <input type="url" id="gameImage" required placeholder="Cole o link direto da imagem">
                    </div>
                    <div class="form-row">
                        <div class="input-group">
                            <label for="gameSize">Tamanho:</label>
                            <input type="text" id="gameSize" required placeholder="Ex: 1.2 GB">
                        </div>
                        <div class="input-group">
                            <label for="gameFormat">Formato:</label>
                            <input type="text" id="gameFormat" required placeholder="Ex: ISO / APK">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="gameStatus">Preço / Status:</label>
                        <input type="text" id="gameStatus" required placeholder="Ex: Grátis">
                    </div>
                    <div class="input-group">
                        <label for="gameLink">Link de Download:</label>
                        <input type="url" id="gameLink" required placeholder="Cole o link do MediaFire, Mega, etc.">
                    </div>
                    <button type="submit">Publicar Jogo</button>
                </form>
            </div>
        </div>

        <!-- ABA JOGOS -->
        <div id="jogos" class="tab-content">
            <header>
                <h1>🕹️ Vitrine de Jogos</h1>
                <p>Explore todos os jogos disponíveis para download</p>
            </header>

            <!-- Vitrine de Jogos -->
            <div class="games-grid" id="gamesGrid">
                <!-- Os jogos cadastrados vão aparecer aqui automaticamente -->
            </div>
        </div>
    </div>

    <script>
        const gameForm = document.getElementById('gameForm');
        const gamesGrid = document.getElementById('gamesGrid');

        // Função para alternar as abas
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // Carregar jogos salvos ao abrir a página
        document.addEventListener('DOMContentLoaded', loadGames);

        gameForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('gameName').value;
            const image = document.getElementById('gameImage').value;
            const size = document.getElementById('gameSize').value;
            const format = document.getElementById('gameFormat').value;
            const status = document.getElementById('gameStatus').value;
            const link = document.getElementById('gameLink').value;

            const newGame = { id: Date.now(), name, image, size, format, status, link };

            saveGame(newGame);
            gameForm.reset();
            loadGames();

            // Vai automaticamente para a aba de jogos após publicar
            document.querySelector("button[onclick=\"switchTab('jogos')\"]").click();
        });

        function getGames() {
            return JSON.parse(localStorage.getItem('my_games')) || [];
        }

        function saveGame(game) {
            const games = getGames();
            games.push(game);
            localStorage.setItem('my_games', JSON.stringify(games));
        }

        function deleteGame(id) {
            let games = getGames();
            games = games.filter(game => game.id !== id);
            localStorage.setItem('my_games', JSON.stringify(games));
            loadGames();
        }

        function loadGames() {
            const games = getGames();
            gamesGrid.innerHTML = '';

            if (games.length === 0) {
                gamesGrid.innerHTML = '<p class="empty-msg">Nenhum jogo cadastrado ainda. Vá na aba Início e adicione o primeiro!</p>';
                return;
            }

            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';

                card.innerHTML = `
                    <div>
                        <img src="${game.image}" alt="${game.name}" onerror="this.src='https://via.placeholder.com/250x160?text=Erro+na+Imagem'">
                        <div class="game-info">
                            <h3>${game.name}</h3>
                            <div class="game-details">
                                <span>📦 Tamanho: <strong>${game.size}</strong></span>
                                <span>📁 Formato: <strong>${game.format}</strong></span>
                                <span>💰 Status: <strong>${game.status}</strong></span>
                            </div>
                            <a href="${game.link}" target="_blank" class="download-btn">Baixar Jogo</a>
                        </div>
                    </div>
                    <div style="padding: 0 15px 15px 15px;">
                        <button class="delete-btn" onclick="deleteGame(${game.id})">Excluir</button>
                    </div>
                `;

                gamesGrid.appendChild(card);
            });
        }
    </script>
</body>
</html>
