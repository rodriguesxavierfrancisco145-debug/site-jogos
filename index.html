<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameHub - Publica o teu Jogo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid #2a2a2a;
            margin-bottom: 30px;
        }

        header h1 {
            color: #00ff88;
            font-size: 2.5rem;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Formulário de Publicação */
        .publish-box {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 40px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .publish-box h2 {
            margin-bottom: 15px;
            color: #00ff88;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #cccccc;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 5px;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 1rem;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #00ff88;
        }

        button {
            background-color: #00ff88;
            color: #121212;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #00cc6a;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        /* Grelha de Jogos */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .game-card {
            background-color: #1e1e1e;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        .game-card:hover {
            transform: translateY(-5px);
        }

        .game-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background-color: #333;
        }

        .game-info {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .game-info h3 {
            margin-bottom: 8px;
            color: #ffffff;
        }

        .game-info p {
            color: #aaaaaa;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .play-btn {
            display: block;
            text-align: center;
            background-color: #6200ea;
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .play-btn:hover {
            background-color: #7c4dff;
        }

        .loading-text {
            color: #00ff88;
            font-size: 1.2rem;
            text-align: center;
            grid-column: 1 / -1;
            padding: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎮 GameHub</h1>
        <p>Publica e descobre jogos independentes online!</p>
    </header>

    <div class="container">
        <!-- Secção para publicar -->
        <section class="publish-box">
            <h2>🚀 Publicar um Novo Jogo</h2>
            <form id="gameForm">
                <div class="form-group">
                    <label for="title">Nome do Jogo:</label>
                    <input type="text" id="title" placeholder="Ex: Super Aventura 2D" required>
                </div>
                <div class="form-group">
                    <label for="description">Descrição:</label>
                    <textarea id="description" rows="3" placeholder="Conta como funciona o teu jogo..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="image">Link da Imagem de Capa (URL):</label>
                    <input type="url" id="image" placeholder="https://exemplo.com" required>
                </div>
                <div class="form-group">
                    <label for="link">Link do Jogo (para jogar ou descarregar):</label>
                    <input type="url" id="link" placeholder="https://itch.io" required>
                </div>
                <button type="submit" id="submitBtn">Publicar Jogo</button>
            </form>
        </section>

        <!-- Lista de Jogos Publicados -->
        <section>
            <h2 style="margin-bottom: 20px;">🕹️ Jogos da Comunidade</h2>
            <div class="games-grid" id="gamesList">
                <p class="loading-text">A carregar jogos da nuvem...</p>
            </div>
        </section>
    </div>

    <script>
        // Configurações da tua API JSONBin.io
        const BIN_ID = '6ac14773ac6210605a105749';
        const API_KEY = '$2a$10$IiEJXJC7SzKZwe0fHMpSbu.vrgTI2VdWiSU3ZJXdotVepr1FMekoC';
        const API_URL = `https://jsonbin.io{BIN_ID}`;

        const gameForm = document.getElementById('gameForm');
        const gamesList = document.getElementById('gamesList');
        const submitBtn = document.getElementById('submitBtn');

        let games = [];

        // 1. Buscar os jogos guardados na nuvem
        async function fetchGames() {
            try {
                const response = await fetch(`${API_URL}/latest`, {
                    method: 'GET',
                    headers: {
                        'X-Master-Key': API_KEY
                    }
                });

                if (!response.ok) throw new Error('Erro ao ligar à base de dados');

                const data = await response.json();
                
                // Verifica se o Bin já tem uma lista de jogos ou se está vazio/novo
                if (Array.isArray(data.record)) {
                    games = data.record;
                } else if (data.record && Array.isArray(data.record.games)) {
                    games = data.record.games;
                } else {
                    games = [];
                }

                renderGames();
            } catch (error) {
                console.error(error);
                gamesList.innerHTML = '<p class="loading-text" style="color: #ff5252;">Erro ao carregar os jogos. Verifica a tua ligação ou as chaves da API.</p>';
            }
        }

        // 2. Guardar a lista atualizada na nuvem
        async function saveGamesToCloud() {
            const response = await fetch(API_URL, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify({ games: games })
            });

            if (!response.ok) {
                throw new Error('Falha ao guardar na nuvem');
            }
        }

        // 3. Mostrar os jogos no ecrã
        function renderGames() {
            gamesList.innerHTML = '';

            if (games.length === 0) {
                gamesList.innerHTML = '<p class="loading-text">Ainda não há jogos publicados. Sê o primeiro a publicar!</p>';
                return;
            }

            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <img src="${game.image}" alt="${game.title}" onerror="this.src='https://placeholder.com'">
                    <div class="game-info">
                        <div>
                            <h3>${game.title}</h3>
                            <p>${game.description}</p>
                        </div>
                        <a href="${game.link}" target="_blank" class="play-btn">Jogar / Descarregar</a>
                    </div>
                `;
                gamesList.appendChild(card);
            });
        }

        // 4. Quando o utilizador publica um jogo
        gameForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            // Bloqueia o botão enquanto envia para evitar cliques duplos
            submitBtn.disabled = true;
            submitBtn.textContent = 'A publicar...';

            const newGame = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                image: document.getElementById('image').value,
                link: document.getElementById('link').value
            };

            try {
                // Adiciona o novo jogo ao topo da lista
                games.unshift(newGame);

                // Envia para o JSONBin
                await saveGamesToCloud();

                // Atualiza o ecrã e limpa o formulário
                renderGames();
                gameForm.reset();
                alert('Jogo publicado na nuvem com sucesso!');
