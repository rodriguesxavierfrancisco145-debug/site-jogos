<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTA Mod Studio AI</title>
  <!-- Biblioteca para gerar arquivos ZIP direto no navegador -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f111a;
      color: #e1e1e6;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Cabeçalho */
    header {
      background-color: #161824;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #282a36;
    }

    header h1 {
      font-size: 1.2rem;
      color: #00d26a;
      letter-spacing: 1px;
    }

    .btn-export {
      background-color: #00d26a;
      color: #000;
      border: none;
      padding: 8px 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-export:hover {
      background-color: #00b85c;
    }

    /* Layout Principal */
    .main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 55px);
    }

    /* Painel Esquerdo: Arquivos e Mods */
    .sidebar-left {
      width: 260px;
      background-color: #161824;
      border-right: 1px solid #282a36;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .sidebar-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      color: #8b92a5;
      letter-spacing: 0.5px;
    }

    .upload-area {
      border: 2px dashed #383a59;
      border-radius: 6px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      background-color: #1a1c29;
    }

    .upload-area:hover {
      border-color: #00d26a;
    }

    .file-input {
      display: none;
    }

    .mod-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mod-item {
      background-color: #212333;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Área Central: Gameplay/Preview */
    .preview-area {
      flex: 1;
      background-color: #050508;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .canvas-placeholder {
      width: 90%;
      height: 80%;
      border: 1px solid #282a36;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #1a1c29 0%, #08090d 100%);
      color: #565d73;
    }

    /* Painel Direito: Chat da IA */
    .sidebar-right {
      width: 320px;
      background-color: #161824;
      border-left: 1px solid #282a36;
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 15px;
      border-bottom: 1px solid #282a36;
      font-weight: bold;
    }

    .chat-messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.88rem;
      line-height: 1.4;
    }

    .message.system {
      background-color: #212333;
      align-self: flex-start;
    }

    .message.user {
      background-color: #00d26a;
      color: #000;
      align-self: flex-end;
    }

    .chat-input-container {
      padding: 15px;
      border-top: 1px solid #282a36;
      display: flex;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      background-color: #0f111a;
      border: 1px solid #282a36;
      padding: 10px;
      border-radius: 4px;
      color: #fff;
      outline: none;
    }

    .chat-input:focus {
      border-color: #00d26a;
    }

    .btn-send {
      background-color: #212333;
      color: #00d26a;
      border: 1px solid #00d26a;
      padding: 0 15px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-send:hover {
      background-color: #00d26a;
      color: #000;
    }
  </style>
</head>
<body>

  <!-- Cabeçalho -->
  <header>
    <h1>GTA MOD STUDIO AI</h1>
    <button class="btn-export" onclick="exportModPack()">Exportar Jogo Modificado (.ZIP)</button>
  </header>

  <!-- Container Principal -->
  <div class="main-container">
    
    <!-- Esquerda: Gerenciador de Arquivos -->
    <div class="sidebar-left">
      <div class="sidebar-title">Arquivos do Jogo</div>
      <label class="upload-area">
        <p style="font-size: 0.85rem;">Clique para carregar a pasta do GTA / Mods</p>
        <input type="file" class="file-input" id="fileInput" multiple webkitdirectory />
      </label>

      <div class="sidebar-title">Mods Gerados</div>
      <ul class="mod-list" id="modList">
        <li class="mod-item">
          <span>super_pulo.cs</span>
          <small style="color: #00d26a;">Ativo</small>
        </li>
      </ul>
    </div>

    <!-- Centro: Tela de Simulação / Preview -->
    <div class="preview-area">
      <div class="canvas-placeholder">
        <svg width="64" height="64" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.91 11.672a.375.375 0 010 .656l-5.603 3.113a.375.375 0 01-.557-.328V8.887c0-.286.307-.466.557-.327l5.603 3.112z" />
        </svg>
        <p style="margin-top: 15px;">Área de Pré-visualização do Jogo</p>
        <small>Carregue os arquivos ou digite um comando para simular as alterações</small>
      </div>
    </div>

    <!-- Direita: Assistente de IA -->
    <div class="sidebar-right">
      <div class="chat-header">Assistente de Criação</div>
      <div class="chat-messages" id="chatMessages">
        <div class="message system">
          Olá! O que você quer criar ou alterar no GTA San Andreas hoje? Digite sua ideia abaixo.
        </div>
      </div>
      <div class="chat-input-container">
        <input type="text" class="chat-input" id="chatInput" placeholder="Ex: Crie um script para voar..." />
        <button class="btn-send" onclick="sendMessage()">Gerar</button>
      </div>
    </div>

  </div>

  <!-- Lógica da Aplicação -->
  <script>
    const generatedScripts = [
      {
        filename: "cleo/super_pulo.cs",
        content: "{$CLEO .cs}\n0000: NOP\n:MAIN\nwait 0\nif\n  key_pressed 32\nthen\n  // Pulo turbinado\nend\njump @MAIN"
      }
    ];

    function sendMessage() {
      const input = document.getElementById('chatInput');
      const messagesContainer = document.getElementById('chatMessages');
      const text = input.value.trim();

      if (!text) return;

      // Adiciona mensagem do usuário
      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.innerText = text;
      messagesContainer.appendChild(userMsg);

      input.value = '';
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      // Resposta simulada da IA
      setTimeout(() => {
        const aiMsg = document.createElement('div');
        aiMsg.className = 'message system';
        aiMsg.innerText = `Script gerado com sucesso para: "${text}". Adicionado à lista de mods.`;
        messagesContainer.appendChild(aiMsg);

        // Adiciona à lista da barra lateral
        const newFileName = `mod_custom_${Date.now()}.cs`;
        generatedScripts.push({
          filename: `cleo/${newFileName}`,
          content: `// Mod gerado para: ${text}\n{$CLEO .cs}\n0000: NOP\n`
        });

        const modList = document.getElementById('modList');
        const item = document.createElement('li');
        item.className = 'mod-item';
        item.innerHTML = `<span>${newFileName}</span><small style="color: #00d26a;">Ativo</small>`;
        modList.appendChild(item);

        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }, 1000);
    }

    // Função para exportar os arquivos modificados em .ZIP
    function exportModPack() {
      const zip = new JSZip();
      
      // Adiciona os scripts gerados dentro da pasta /cleo no zip
      generatedScripts.forEach(script => {
        zip.file(script.filename, script.content);
      });

      zip.generateAsync({ type: "blob" }).then(function(content) {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = "GTA_SA_Modded_Pack.zip";
        link.click();
      });
    }

    // Permitir enviar pressionando a tecla Enter
    document.getElementById('chatInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    });
  </script>
</body>
</html>
