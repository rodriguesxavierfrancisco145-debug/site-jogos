<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GTA Mod Studio AI</title>
  <!-- Fontes Gamer -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- Biblioteca para gerar ZIP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  
  <style>
    :root {
      --bg-dark: #090a10;
      --card-bg: rgba(18, 20, 29, 0.75);
      --card-border: rgba(0, 255, 136, 0.15);
      --neon-green: #00ff88;
      --neon-green-glow: rgba(0, 255, 136, 0.4);
      --neon-cyan: #00e5ff;
      --text-main: #f0f3fe;
      --text-muted: #7e859b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(0, 255, 136, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(0, 229, 255, 0.05) 0%, transparent 40%);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* Cabeçalho */
    header {
      background: rgba(12, 14, 22, 0.9);
      backdrop-filter: blur(12px);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      z-index: 10;
    }

    header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      background: linear-gradient(90deg, var(--neon-green), var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .btn-export {
      background: linear-gradient(135deg, var(--neon-green), #00b85c);
      color: #000;
      border: none;
      padding: 8px 16px;
      font-weight: 700;
      font-size: 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 12px var(--neon-green-glow);
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-export:active {
      transform: scale(0.96);
    }

    /* Navegação mobile (Tabs) */
    .mobile-nav {
      display: flex;
      background: #0d0f17;
      border-bottom: 1px solid var(--card-border);
    }

    .nav-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-muted);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
    }

    .nav-tab.active {
      color: var(--neon-green);
      border-bottom-color: var(--neon-green);
      background: rgba(0, 255, 136, 0.05);
    }

    /* Container Principal */
    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* Painel Esquerdo */
    .sidebar-left {
      width: 280px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-right: 1px solid var(--card-border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sidebar-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: var(--neon-cyan);
      text-transform: uppercase;
    }

    .upload-area {
      border: 1.5px dashed rgba(0, 255, 136, 0.3);
      border-radius: 10px;
      padding: 18px 12px;
      text-align: center;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
      display: block;
    }

    .upload-area:hover {
      border-color: var(--neon-green);
      box-shadow: inset 0 0 15px rgba(0, 255, 136, 0.1);
    }

    .file-input { display: none; }

    .mod-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .mod-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mod-item:hover {
      background: rgba(0, 255, 136, 0.08);
      border-color: rgba(0, 255, 136, 0.3);
    }

    .badge-active {
      background: rgba(0, 255, 136, 0.15);
      color: var(--neon-green);
      border: 1px solid rgba(0, 255, 136, 0.3);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
    }

    /* Área Central (Preview) */
    .preview-area {
      flex: 1;
      background: #040508;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      position: relative;
    }

    .canvas-placeholder {
      width: 100%;
      height: 100%;
      max-width: 900px;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #101424 0%, #05060a 100%);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
      position: relative;
      overflow: hidden;
      text-align: center;
      padding: 20px;
    }

    .canvas-placeholder::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-green), transparent);
    }

    .play-icon {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(0, 255, 136, 0.1);
      border: 1px solid var(--neon-green);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      box-shadow: 0 0 20px var(--neon-green-glow);
    }

    /* Painel Direito (Chat) */
    .sidebar-right {
      width: 340px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-left: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--card-border);
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      color: var(--neon-cyan);
    }

    .chat-messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      line-height: 1.4;
      max-width: 85%;
    }

    .message.system {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

    .message.user {
      background: linear-gradient(135deg, var(--neon-green), #00b85c);
      color: #000;
      font-weight: 600;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .chat-input-container {
      padding: 12px;
      border-top: 1px solid var(--card-border);
      display: flex;
      gap: 8px;
      background: rgba(0, 0, 0, 0.2);
    }

    .chat-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px;
      border-radius: 8px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .chat-input:focus {
      border-color: var(--neon-green);
      box-shadow: 0 0 10px var(--neon-green-glow);
    }

    .btn-send {
      background: var(--neon-green);
      color: #000;
      border: none;
      padding: 0 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s;
    }

    .btn-send:hover {
      box-shadow: 0 0 12px var(--neon-green-glow);
    }

    /* REGRAS RESPONSIVAS PARA CELULAR */
    @media (max-width: 850px) {
      .mobile-nav { display: flex; }
      
      .sidebar-left, .preview-area, .sidebar-right {
        width: 100%;
        height: 100%;
        display: none;
      }

      .main-container.tab-files .sidebar-left { display: flex; }
      .main-container.tab-preview .preview-area { display: flex; }
      .main-container.tab-chat .sidebar-right { display: flex; }
    }

    @media (min-width: 851px) {
      .mobile-nav { display: none; }
      .sidebar-left, .preview-area, .sidebar-right { display: flex !important; }
    }
  </style>
</head>
<body>

  <!-- Cabeçalho -->
  <header>
    <h1>GTA MOD STUDIO</h1>
    <button class="btn-export" onclick="exportModPack()">Exportar (.ZIP)</button>
  </header>

  <!-- Navegação em Abas no Celular -->
  <div class="mobile-nav">
    <button class="nav-tab" onclick="switchTab('files')">Arquivos</button>
    <button class="nav-tab active" onclick="switchTab('preview')">Preview</button>
    <button class="nav-tab" onclick="switchTab('chat')">IA Modder</button>
  </div>

  <!-- Container Principal -->
  <div class="main-container tab-preview" id="mainContainer">
    
    <!-- Esquerda: Gerenciador de Arquivos -->
    <div class="sidebar-left">
      <div class="sidebar-title">Arquivos do Jogo</div>
      <label class="upload-area" for="fileInput">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-bottom: 5px; color: var(--neon-green);">
          <path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
        </svg>
        <p style="font-size: 0.85rem; color: var(--text-main);">Carregar Pasta do GTA / Mods</p>
        <input type="file" class="file-input" id="fileInput" multiple webkitdirectory onchange="handleFileSelection(event)" />
      </label>

      <div class="sidebar-title">Mods Ativos</div>
      <ul class="mod-list" id="modList">
        <li class="mod-item" onclick="downloadSingleMod(0)">
          <span>super_pulo.cs</span>
          <span class="badge-active">ATIVO</span>
        </li>
      </ul>
    </div>

    <!-- Centro: Tela de Simulação / Preview -->
    <div class="preview-area">
      <div class="canvas-placeholder">
        <div class="play-icon">
          <svg width="28" height="28" fill="var(--neon-green)" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </div>
        <h3 style="color: #fff; font-family: 'Orbitron'; font-size: 1.1rem; margin-bottom: 6px;">Simulador do Jogo</h3>
        <p style="color: var(--text-muted); font-size: 0.85rem; max-width: 300px;">
          Suba os arquivos ou envie um comando no chat da IA para ver o mod em ação.
        </p>
      </div>
    </div>

    <!-- Direita: Assistente de IA -->
    <div class="sidebar-right">
      <div class="chat-header">Assistente de Criação</div>
      <div class="chat-messages" id="chatMessages">
        <div class="message system">
          E aí! O que você quer criar pro GTA San Andreas hoje? Digite sua ideia abaixo!
        </div>
      </div>
      <div class="chat-input-container">
        <input type="text" class="chat-input" id="chatInput" placeholder="Ex: CJ voa com a tecla SHIFT..." />
        <button class="btn-send" onclick="sendMessage()">Gerar</button>
      </div>
    </div>

  </div>

  <!-- Script da Aplicação -->
  <script>
    const generatedScripts = [
      {
        filename: "cleo/super_pulo.cs",
        displayName: "super_pulo.cs",
        content: "{$CLEO .cs}\n0000: NOP\n:MAIN\nwait 0\nif\n  key_pressed 32\nthen\n  // Pulo turbinado\nend\njump @MAIN"
      }
    ];

    // Troca de abas no celular
    function switchTab(tabName) {
      const container = document.getElementById('mainContainer');
      const tabs = document.querySelectorAll('.nav-tab');
      
      container.className = `main-container tab-${tabName}`;
      
      tabs.forEach((tab, index) => {
        tab.classList.remove('active');
        if (
          (tabName === 'files' && index === 0) ||
          (tabName === 'preview' && index === 1) ||
          (tabName === 'chat' && index === 2)
        ) {
          tab.classList.add('active');
        }
      });
    }

    // Trata os arquivos selecionados
    function handleFileSelection(event) {
      const files = event.target.files;
      if (files.length > 0) {
        alert(`${files.length} arquivo(s) carregado(s) com sucesso para o projeto!`);
      }
    }

    // Função para baixar um mod individual com confirmação
    function downloadSingleMod(index) {
      const script = generatedScripts[index];
      if (!script) return;

      const confirmDownload = confirm(`Deseja baixar o mod "${script.displayName}"?`);
      if (confirmDownload) {
        const blob = new Blob([script.content], { type: 'text/plain;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = script.displayName;
        link.click();
      }
    }

    function sendMessage() {
      const input = document.getElementById('chatInput');
      const messagesContainer = document.getElementById('chatMessages');
      const text = input.value.trim();

      if (!text) return;

      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.innerText = text;
      messagesContainer.appendChild(userMsg);

      input.value = '';
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      setTimeout(() => {
        const aiMsg = document.createElement('div');
        aiMsg.className = 'message system';
        aiMsg.innerText = `Script CLEO gerado pra: "${text}". Mod ativado na lista!`;
        messagesContainer.appendChild(aiMsg);

        const newFileName = `mod_custom_${Date.now()}.cs`;
        const scriptIndex = generatedScripts.length;

        generatedScripts.push({
          filename: `cleo/${newFileName}`,
          displayName: newFileName,
          content: `// Mod: ${text}\n{$CLEO .cs}\n0000: NOP\n`
        });

        const modList = document.getElementById('modList');
        const item = document.createElement('li');
        item.className = 'mod-item';
        item.onclick = function() { downloadSingleMod(scriptIndex); };
        item.innerHTML = `<span>${newFileName}</span><span class="badge-active">ATIVO</span>`;
        modList.appendChild(item);

        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }, 1000);
    }

    function exportModPack() {
      const zip = new JSZip();
      
      generatedScripts.forEach(script => {
        zip.file(script.filename, script.content);
      });

      zip.generateAsync({ type: "blob" }).then(function(content) {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(content);
        link.download = "GTA_SA_Modded_Pack.zip";
        link.click();
      });
    }

    document.getElementById('chatInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
