<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site de Jogos</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --text-color: #e1e1e6;
            --text-muted: #7c7c8a;
            --primary: #00b37e;
            --primary-hover: #00875f;
            --accent-pink: #f72585;
            --danger: #f75a68;
            --warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 15px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        /* Topo / Header Moderno */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            position: relative;
        }

        .logo {
            color: var(--accent-pink);
            font-size: 1.5rem;
            font-weight: bold;
        }

        .search-container {
            flex: 1;
            margin: 0 12px;
        }

        .search-box {
            width: 100%;
            background-color: #202024;
            border: none;
            border-radius: 20px;
            padding: 8px 15px;
            color: white;
            font-size: 0.9rem;
            outline: none;
        }

        .top-icons {
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            position: relative;
        }

        /* Menu Dropdown dos Três Pontinhos */
        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 35px;
            background-color: var(--card-bg);
            border: 1px solid #323238;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            width: 150px;
            z-index: 100;
            overflow: hidden;
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-item {
            padding: 10px 15px;
            font-size: 0.85rem;
            color: var(--text-color);
            cursor: pointer;
            border-bottom: 1px solid #202024;
            text-decoration: none;
            display: block;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item:hover {
            background-color: #202024;
            color: var(--accent-pink);
        }

        /* Categorias (Filtros redondos em rolagem horizontal) */
        .categories {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
            scrollbar-width: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .cat-btn {
            background-color: #202024;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }

        .cat-btn.active {
            background-color: var(--accent-pink);
        }

        /* Abas de Navegação */
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* Formulário do Painel Admin */
        .form-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .form-card h2 {
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #323238;
            background-color: #121214;
            color: white;
            font-size: 0.9rem;
            outline: none;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .input-group {
            flex: 1;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        /* Grid de Jogos (2 colunas) */
        .games-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            cursor: pointer;
        }

        .card-img-container {
            position: relative;
            width: 100%;
            height: 140px;
        }

        .game-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Selo de Status/Preço Flutuante na Imagem */
        .price-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background-color: rgba(0, 0, 0, 0.75);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #10b981;
        }

        .game-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .game-info h3 {
            font-size: 0.95rem;
            margin-bottom: 6px;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-details {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        /* Curtidas estilo o novo design */
        .likes-row {
            display: flex;
            gap: 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .download-btn {
            display: block;
            text-align: center;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            padding: 8px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-top: auto;
        }

        .download-btn:hover {
            background-color: var(--primary-hover);
        }

        .delete-btn {
            background-color: var(--danger);
            margin-top: 8px;
            padding: 6px;
            font-size: 0.75rem;
            width: 100%;
            border-radius: 6px;
        }

        .delete-btn:hover {
            background-color: #d93848;
        }

        .empty-msg {
            text-align: center;
            grid-column: 1 / -1;
            color: var(--text-muted);
            font-style: italic;
            padding: 30px;
        }

        /* Estilo da Página de Detalhes do Jogo */
        .game-detail-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .back-btn {
            background-color: #202024;
            color: var(--text-color);
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            margin-bottom: 15px;
            width: auto;
        }
        .back-btn:hover {
            background-color: #323238;
        }

        .detail-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .detail-info h2 {
            font-size: 1.4rem;
            margin-bottom: 10px;
            color: white;
        }

        .detail-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin: 15px 0;
            line-height: 1.4;
            white-space: pre-wrap;
        }

        /* Acesso restrito no rodapé */
        .admin-login-area {
            text-align: center;
            margin-top: 40px;
            padding-top: 15px;
            border-top: 1px solid #202024;
        }

        .admin-link {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.75rem;
            cursor: pointer;
            text-decoration: underline;
            width: auto;
        }
        .admin-link:hover {
            color: var(--primary);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- TOPO NOVO ESTILO -->
        <div class="top-bar">
            <div class="logo">ZonaXP</div>
            <div class="search-container">
                <input type="text" class="search-box" id="searchInput" placeholder="Buscar jogos..." oninput="loadGames()">
            </div>
            <div class="top-icons">
                <span onclick="solicitarSenha()" title="Admin">🌙</span>
                <span onclick="toggleMenu(event)" title="Menu">☰</span>
                <!-- Menu Dropdown -->
                <div id="dropdownMenu" class="dropdown-menu">
                    <div class="dropdown-item" onclick="abrirModalInfo('Suporte', 'Precisa de ajuda com algum jogo, link quebrado ou dúvida? Entre em contato com nossa equipe de suporte pelo WhatsApp do canal ou comunidade.')">Suporte</div>
                    <div class="dropdown-item" onclick="abrirModalInfo('Ajuda', '1. Escolha o jogo desejado.\n2. Clique nele para ver as informações completas.\n3. Clique em Baixar para obter o arquivo direto.')">Ajuda</div>
                    <div class="dropdown-item" onclick="abrirModalInfo('Parceria', 'Tem interesse em divulgar seu canal, jogo ou site aqui na ZonaXP? Entre em contato para parcerias e anúncios!')">Parceria</div>
                </div>
            </div>
        </div>

        <!-- CATEGORIAS REDONDAS NOVAS -->
        <div class="categories">
            <button class="cat-btn active" onclick="filtrarCategoria('Todos', this)">Todos</button>
            <button class="cat-btn" onclick="filtrarCategoria('PSP', this)">PSP</button>
            <button class="cat-btn" onclick="filtrarCategoria('PS2', this)">PS2</button>
            <button class="cat-btn" onclick="filtrarCategoria('PC', this)">PC</button>
            <button class="cat-btn" onclick="filtrarCategoria('APK', this)">APK</button>
        </div>

        <!-- ABA INÍCIO (PAINEL ADMIN) -->
        <div id="inicio" class="tab-content">
            <header style="margin-bottom: 15px;">
                <h1 style="font-size: 1.8rem;">🔒 Painel Restrito</h1>
                <p style="font-size: 0.85rem; color: var(--text-muted);">Adicione novos jogos à vitrine</p>
            </header>

            <div class="form-card">
                <h2>Publicar Novo Jogo</h2>
                <form id="gameForm">
                    <div class="input-group">
                        <label for="gameName">Nome do Jogo:</label>
                        <input type="text" id="gameName" required placeholder="Ex: GTA San Andreas">
                    </div>
                    <div class="input-group">
                        <label for="gameImage">Link da Imagem (URL):</label>
                        <input type="url" id="gameImage" required placeholder="Cole o link direto da imagem">
                    </div>
                    <div class="input-group">
                        <label for="gameCategory">Categoria:</label>
                        <select id="gameCategory" style="width:150px;">
                            <option value="PSP">PSP</option>
                            <option value="PS2">PS2</option>
                            <option value="PC">PC</option>
                            <option value="APK">APK</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <div class="input-group">
                            <label for="gameSize">Tamanho:</label>
                            <input type="text" id="gameSize" required placeholder="Ex: 1.2 GB">
                        </div>
                        <div class="input-group">
                            <label for="gameFormat">Formato:</label>
                            <input type="text" id="gameFormat" required placeholder="Ex: ISO / APK">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="gameStatus">Preço / Status:</label>
                        <input type="text" id="gameStatus" required placeholder="Ex: Grátis">
                    </div>
                    <div class="input-group">
                        <label for="gameDescription">Informações / Descrição do Jogo:</label>
                        <textarea id="gameDescription" rows="3" placeholder="Digite os detalhes, requisitos ou instruções de instalação..."></textarea>
                    </div>
                    <div class="input-group">
                        <label for="gameLink">Link de Download:</label>
                        <input type="url" id="gameLink" required placeholder="Cole o link do MediaFire, Mega, etc.">
                    </div>
                    <button type="submit">Publicar Jogo</button>
                </form>
                <button onclick="logoutAdmin()" style="background-color: var(--danger); margin-top: 15px;">Sair do Painel Admin</button>
            </div>
        </div>

        <!-- ABA JOGOS (VITRINE) -->
        <div id="jogos" class="tab-content active">
            <div class="games-grid" id="gamesGrid">
                <!-- Os jogos cadastrados aparecem aqui -->
            </div>
        </div>

        <!-- ABA DETALHES DO JOGO -->
        <div id="detalhes" class="tab-content">
            <button class="back-btn" onclick="switchTab('jogos')">← Voltar</button>
            <div id="gameDetailContent">
                <!-- Informações detalhadas do jogo carregadas via JS -->
            </div>
        </div>

        <!-- Rodapé com acesso restrito -->
        <div class="admin-login-area">
            <button class="admin-link" onclick="solicitarSenha()">Entrar como Administrador</button>
        </div>
    </div>

    <script>
        const gameForm = document.getElementById('gameForm');
        const gamesGrid = document.getElementById('gamesGrid');
        const SENHA_ADMIN = "1234"; 
        let categoriaAtual = 'Todos';

        document.addEventListener('DOMContentLoaded', () => {
            loadGames();
            if (localStorage.getItem('isAdmin') === 'true') {
                liberarAdmin();
            }

            // Fechar o menu dropdown ao clicar fora
            window.addEventListener('click', function(e) {
                if (!e.target.closest('.top-icons')) {
                    document.getElementById('dropdownMenu').classList.remove('show');
                }
            });
        });

        function toggleMenu(event) {
            event.stopPropagation();
            document.getElementById('dropdownMenu').classList.toggle('show');
        }

        function abrirInfo(titulo, texto) {
            alert(titulo + ":\n\n" + texto);
            document.getElementById('dropdownMenu').classList.remove('show');
        }

        // Função ajustada para abrir a notificação informativa do menu superior
        function abrirModalInfo(titulo, texto) {
            alert(titulo + "\n\n" + texto);
            document.getElementById('dropdownMenu').classList.remove('show');
        }

        function solicitarSenha() {
            if (localStorage.getItem('isAdmin') === 'true') {
                switchTab('inicio');
                return;
            }
            let senha = prompt("Digite a senha de administrador:");
            if (senha === SENHA_ADMIN) {
                localStorage.setItem('isAdmin', 'true');
                liberarAdmin();
                switchTab('inicio');
                alert("Painel liberado com sucesso!");
            } else if (senha !== null) {
                alert("Senha incorreta!");
            }
        }

        function liberarAdmin() {
            // Admin liberado
        }

        function logoutAdmin() {
            localStorage.removeItem('isAdmin');
            switchTab('jogos');
            alert("Você saiu do modo administrador.");
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.getElementById(tabId).classList.add('active');
        }

        function filtrarCategoria(cat, btn) {
            categoriaAtual = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadGames();
        }

        gameForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('gameName').value;
            const image = document.getElementById('gameImage').value;
            const category = document.getElementById('gameCategory').value || 'PSP';
            const size = document.getElementById('gameSize').value;
            const format = document.getElementById('gameFormat').value;
            const status = document.getElementById('gameStatus').value;
            const description = document.getElementById('gameDescription').value || 'Nenhuma informação adicional informada.';
            const link = document.getElementById('gameLink').value;

            const newGame = { 
                id: Date.now(), 
                name, 
                image, 
                category, 
                size, 
                format, 
                status, 
                description,
                link,
                likes: Math.floor(Math.random() * 25) + 1,
                dislikes: Math.floor(Math.random() * 4)
            };

            saveGame(newGame);
            gameForm.reset();
            loadGames();
            switchTab('jogos');
        });

        function getGames() {
            return JSON.parse(localStorage.getItem('my_games')) || [];
        }

        function saveGame(game) {
            const games = getGames();
            games.push(game);
            localStorage.setItem('my_games', JSON.stringify(games));
        }

        function deleteGame(id) {
            let games = getGames();
            games = games.filter(game => game.id !== id);
            localStorage.setItem('my_games', JSON.stringify(games));
            loadGames();
            switchTab('jogos');
        }

        function verDetalhesDoJogo(id) {
            const games = getGames();
            const game = games.find(g => g.id === id);
            if (!game) return;

            let botaoExcluirDetalhe = '';
            if (localStorage.getItem('isAdmin') === 'true') {
                botaoExcluirDetalhe = `<button class="delete-btn" onclick="deleteGame(${game.id})" style="margin-top: 15px;">Excluir Jogo do Site</button>`;
            }

            const detailContainer = document.getElementById('gameDetailContent');
            detailContainer.innerHTML = `
                <div class="game-detail-card">
                    <img src="${game.image}" class="detail-img" alt="${game.name}" onerror="this.src='https://via.placeholder.com/250x140?text=Erro+na+Imagem'">
                    <div class="detail-info">
                        <h2>${game.name}</h2>
                        <div class="likes-row" style="font-size: 0.85rem; margin-bottom: 12px;">
                            <span>❤ ${game.likes || 12} Curtidas</span>
                            <span>👎 ${game.dislikes || 1} Descurtidas</span>
                            <span style="color: var(--primary);">🏷️ ${game.status}</span>
                        </div>
                        <div class="game-details" style="font-size: 0.85rem; margin-bottom: 15px; gap: 6px;">
                            <span>📦 Tamanho: <strong>${game.size}</strong></span>
                            <span>📁 Formato: <strong>${game.format}</strong></span>
                            <span>📂 Categoria: <strong>${game.category}</strong></span>
                        </div>
                        <h4 style="font-size: 0.95rem; color: white; margin-bottom: 5px;">Informações do Jogo:</h4>
                        <p class="detail-desc">${game.description}</p>
                        
                        <a href="${game.link}" target="_blank" class="download-btn" style="padding: 12px; font-size: 0.95rem; margin-top: 20px;">Baixar Agora (Download Direto)</a>
                        ${botaoExcluirDetalhe}
                    </div>
                </div>
            `;
            switchTab('detalhes');
        }

        function loadGames() {
            const games = getGames();
            const termoBusca = document.getElementById('searchInput') ? document.getElementById('searchInput').value.toLowerCase() : '';
            gamesGrid.innerHTML = '';

            let filtrados = games.filter(game => {
                let matchCat = (categoriaAtual === 'Todos' || (game.category && game.category === categoriaAtual));
                let matchBusca = game.name.toLowerCase().includes(termoBusca);
                return matchCat && matchBusca;
            });

            if (filtrados.length === 0) {
                gamesGrid.innerHTML = '<p class="empty-msg">Nenhum jogo cadastrado ainda.</p>';
                return;
            }

            filtrados.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.onclick = () => verDetalhesDoJogo(game.id);

                let botaoExcluirHtml = '';
                if (localStorage.getItem('isAdmin') === 'true') {
                    botaoExcluirHtml = `
                        <div style="padding: 0 10px 10px 10px;" onclick="event.stopPropagation()">
                            <button class="delete-btn" onclick="deleteGame(${game.id})">Excluir</button>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div>
                        <div class="card-img-container">
                            <img src="${game.image}" alt="${game.name}" onerror="this.src='https://via.placeholder.com/250x140?text=Erro+na+Imagem'">
                            <div class="price-badge">${game.status}</div>
                        </div>
                        <div class="game-info">
                            <h3>${game.name}</h3>
                            <div class="likes-row">
                                <span>❤ ${game.likes || 12}</span>
                                <span>👎 ${game.dislikes || 1}</span>
                            </div>
                            <div class="game-details">
                                <span>📦 Tamanho: <strong>${game.size}</strong></span>
                                <span>📁 Formato: <strong>${game.format}</strong></span>
                            </div>
                            <span class="download-btn" style="display: block;">Ver Detalhes / Baixar</span>
                        </div>
                    </div>
                    ${botaoExcluirHtml}
                `;

                gamesGrid.appendChild(card);
            });
        }
    </script>
</body>
</html>
